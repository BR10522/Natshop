<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NATSHOP Marketplace</title>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
</head>
<body>
  <h1>🛍 NATSHOP Marketplace</h1>

  <div id="liste"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBEHJAskO3whwRKF0YvpbF8CovaUVNh7LQ",
      authDomain: "natshop-f63dc.firebaseapp.com",
      databaseURL: "https://natshop-f63dc-default-rtdb.firebaseio.com",
      projectId: "natshop-f63dc",
      storageBucket: "natshop-f63dc.firebasestorage.app",
      messagingSenderId: "351153362785",
      appId: "1:351153362785:web:417f748d008f17a1c71720"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("products").on("value", (snap) => {
      let html = "";
      snap.forEach((item) => {
        const p = item.val();
        html += `
          <div style="border:1px solid #ddd;padding:10px;margin:10px">
            <img src="${p.image}" width="120"><br>
            <b>${p.nom}</b><br>
            ${p.prix} Gdes
          </div>`;
      });
      document.getElementById("liste").innerHTML = html;
    });
  </script>
</body>
</html>
