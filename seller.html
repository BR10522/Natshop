<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NATSHOP - Espace vendeur</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0}
header{background:#1d4ed8;padding:18px;text-align:center}
main{padding:16px;max-width:480px;margin:auto}
.card{background:#1e293b;border-radius:14px;padding:16px;margin:14px 0}
input,textarea{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:bold}
small{color:#cbd5e1}
</style>
</head>
<body>
<header>
<h1>🏪 NATSHOP</h1>
<p>Espace vendeur</p>
</header>
<main>
<div class="card">
<h2>Inscription vendeur</h2>
<input placeholder="Nom de la boutique">
<input placeholder="Téléphone">
<input placeholder="E-mail">
<button>Créer mon compte</button>
<small>La connexion Firebase sera ajoutée ensuite.</small>
</div>
<div class="card">
<h2>Publier un produit</h2>
<input placeholder="Nom du produit">
<input type="number" placeholder="Prix (Gdes)">
<textarea placeholder="Description"></textarea>
<input placeholder="Lien de la photo">
<button>Publier</button>
</div>
<div class="card">
<h2>Paiement NATSHOP</h2>
<p><b>MonCash :</b> 37843029</p>
<p><b>NatCash :</b> 32692155</p>
</div>
</main>
</body>
</html>
